description = "Commands in the palette that type a command you use often, so you can look at it, change it and press Enter."
author = "Luis Peixoto"
license = "MIT"
homepage = "https://github.com/LuisPeixoto/TermZip/tree/main/examples/plugins/snippets"
permissions = ["type"]

