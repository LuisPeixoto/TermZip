[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/TermZip"
homepage = "https://github.com/LuisPeixoto/TermZip"
readme = "README.md"
authors = ["Luis Peixoto <nandopeixotolfpc@gmail.com>"]
rust-version = "1.95"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
dirs = "6"
eframe = "0.37"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
