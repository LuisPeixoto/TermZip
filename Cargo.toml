[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/TermZip"
homepage = "https://github.com/LuisPeixoto/TermZip"
readme = "README.md"
authors = ["Luis Peixoto <nandopeixotolfpc@gmail.com>"]
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
open = "5"
minisign = "0.10"
minisign-verify = "0.3"
plist = { version = "1", default-features = false }
portable-pty = "0.9"
regex = "1"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
# Portable dispatch is a plain loop. The automatic choice may rely on the optimizer to turn calls into jumps, and
# a plugin that loops then overflows the stack of the host instead of running out of fuel.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
wasmparser = { version = "0.228", default-features = false, features = ["std"] }
wat = "1"
toml = "0.9"
# HTTPS with rustls and bundled roots: no system TLS library to depend on. Only the catalog uses it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
termzip-core = { path = "crates/termzip-core" }
termzip-plugin-api = { path = "crates/termzip-plugin-api" }
termzip-plugins = { path = "crates/termzip-plugins" }
termzip-pty = { path = "crates/termzip-pty" }
termzip-shell = { path = "crates/termzip-shell" }

# The interpreter that runs plugins is slow without optimization, which makes a debug build (and the tests) wait
# for a plugin that is meant to be stopped by its fuel. Optimizing it costs nothing in the code that is edited.
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
