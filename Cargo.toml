[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/TermZip"
homepage = "https://github.com/LuisPeixoto/TermZip"
readme = "README.md"
authors = ["Luis Peixoto <nandopeixotolfpc@gmail.com>"]
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
open = "5"
plist = { version = "1", default-features = false }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
toml = "0.9"
termzip-core = { path = "crates/termzip-core" }
termzip-plugin-api = { path = "crates/termzip-plugin-api" }
termzip-pty = { path = "crates/termzip-pty" }
termzip-shell = { path = "crates/termzip-shell" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
