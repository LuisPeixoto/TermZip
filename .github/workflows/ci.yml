name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude termzip-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude termzip-desktop

  plugins:
    name: Example plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/plugins -> target
      - name: Format
        run: cargo fmt --all --check --manifest-path examples/plugins/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path examples/plugins/Cargo.toml --all-targets -- -D warnings
      - name: Clippy (WebAssembly)
        run: cargo clippy --manifest-path examples/plugins/Cargo.toml --release --target wasm32-unknown-unknown -- -D warnings
      - name: Test (examples)
        run: cargo test --manifest-path examples/plugins/Cargo.toml
      - name: Build the examples for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/plugins/Cargo.toml
      - name: Run the built examples in the app's sandbox
        run: cargo test -p termzip-plugins --test examples -- --ignored

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check the interface
        run: npm run check
      - name: Unit-test the interface
        run: npm run test
      - name: Build the interface
        run: npm run build
      - name: Test (desktop shell)
        run: cargo test -p termzip-desktop
      - name: Clippy (desktop shell)
        run: cargo clippy -p termzip-desktop --all-targets -- -D warnings
      - name: Build the desktop application
        run: npm run tauri build -- --debug --no-bundle
