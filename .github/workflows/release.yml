name: Release

# Push a tag such as v0.1.0 to build desktop bundles and a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the application version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          tauri=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          npm=$(jq -r .version apps/desktop/package.json)
          echo "tag=$expected workspace=$workspace tauri=$tauri npm=$npm"
          for found in "$workspace" "$tauri" "$npm"; do
            if [ "$found" != "$expected" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the application version ($found)"
              exit 1
            fi
          done
      - name: Create a draft release if one does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "TermZip $GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/LuisPeixoto/TermZip/blob/main/CHANGELOG.md) for what is new."
          fi

  desktop:
    name: Desktop bundle (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-24.04, target: "" }
          - { name: Windows, os: windows-latest, target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build bundles
        working-directory: apps/desktop
        shell: bash
        env:
          # Signs the update files; the app checks them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target "${{ matrix.target }}"
          else
            npm run tauri build
          fi
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # The desktop shell is a Cargo workspace member, so the build output is the workspace's
          # target/ at the repository root; with --target the bundles sit under target/<triple>/.
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) \
            -exec cp {} artifacts/ \;
          # Both Macs build a file called TermZip.app.tar.gz; the updater needs to tell them apart.
          version="${GITHUB_REF_NAME#v}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin) arch=x64 ;;
            *) arch="" ;;
          esac
          if [ -n "$arch" ]; then
            for suffix in "" ".sig"; do
              mv "artifacts/TermZip.app.tar.gz$suffix" "artifacts/TermZip_${version}_${arch}.app.tar.gz$suffix"
            done
          fi
          ls -la artifacts
          if [ -z "$(ls -A artifacts)" ]; then
            echo "::error::No installer was found under target/*/release/bundle"
            exit 1
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: Release checksums
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Create latest.json for the updater
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes of this version, from the changelog.
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next } found' CHANGELOG.md > notes.md
          rm -f assets/latest.json
          python3 tools/make-latest-json.py --version "$version" --notes-file notes.md --assets assets \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > latest.json
          cp latest.json assets/latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create SHA-256 manifest
        run: |
          # A re-run must not hash the manifest uploaded by a previous run.
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum * > ../SHA256SUMS)
      - name: Upload SHA-256 manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber