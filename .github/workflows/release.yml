name: Release

# Push a tag such as v0.1.0 to build desktop bundles and a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    steps:
      - name: Create a draft release if one does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "TermZip $GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/LuisPeixoto/TermZip/blob/main/CHANGELOG.md) for what is new."
          fi

  desktop:
    name: Desktop bundle (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS (Intel), os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { name: Linux, os: ubuntu-24.04, args: "" }
          - { name: Windows, os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build bundles
        working-directory: apps/desktop
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find apps/desktop/src-tauri/target -maxdepth 4 \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: Release checksums
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Create SHA-256 manifest
        run: sha256sum * > SHA256SUMS
      - name: Upload SHA-256 manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber